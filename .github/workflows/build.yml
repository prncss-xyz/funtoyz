on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches-ignore:
      - main
      - dev
env:
  BASE_PATH: '/funtoyz/'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Ci
        run: vp run ci
      - name: Upload to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
